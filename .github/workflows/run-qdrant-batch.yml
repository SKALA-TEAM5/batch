name: Run Qdrant Batch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Batch mode
        required: true
        default: ingest
        type: choice
        options:
          - ingest
          - refresh

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: skala-2025
  K8S_NAMESPACE: skala3-finalproj-class2-team5
  IMAGE_NAME: team5-batch
  IMAGE_TAG: latest

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/team5-batch:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Set namespace
        run: |
          kubectl config set-context --current --namespace="${K8S_NAMESPACE}"

      - name: Run selected batch job
        run: |
          if [ "${{ inputs.mode }}" = "refresh" ]; then
            JOB_NAME=team5-qdrant-refresh
            JOB_FILE=k8s/qdrant-refresh-job.yaml
          else
            JOB_NAME=team5-qdrant-ingest
            JOB_FILE=k8s/qdrant-ingest-job.yaml
          fi

          kubectl delete job "${JOB_NAME}" --ignore-not-found=true
          kubectl apply -f "${JOB_FILE}"
          kubectl wait --for=condition=complete "job/${JOB_NAME}" --timeout=3600s
          kubectl logs "job/${JOB_NAME}"
