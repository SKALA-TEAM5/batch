name: Run Qdrant Batch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Batch mode
        required: true
        default: ingest
        type: choice
        options:
          - ingest
          - refresh
          - safety-doc-reference

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: skala-2025
  K8S_NAMESPACE: skala3-finalproj-class2-team5
  IMAGE_NAME: team5-batch
  IMAGE_TAG: latest

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/team5-batch:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Set namespace
        run: |
          kubectl config set-context --current --namespace="${K8S_NAMESPACE}"

      - name: Apply batch secrets
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: |
          kubectl create secret generic team5-batch-secret \
            --namespace="${K8S_NAMESPACE}" \
            --from-literal=LAW_API_KEY="${LAW_API_KEY}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Run selected batch job
        run: |
          if [ "${{ inputs.mode }}" = "refresh" ]; then
            JOB_NAME=team5-qdrant-refresh
            JOB_FILE=k8s/qdrant-refresh-job.yaml
            kubectl delete job "${JOB_NAME}" --ignore-not-found=true
            kubectl apply -f "${JOB_FILE}"
            kubectl get job "${JOB_NAME}" -o wide
            kubectl get pods -l job-name="${JOB_NAME}" -o wide
            echo "Refresh job triggered. Follow logs with:"
            echo "kubectl logs -f job/${JOB_NAME} -n ${K8S_NAMESPACE}"
          elif [ "${{ inputs.mode }}" = "safety-doc-reference" ]; then
            JOB_NAME=team5-safety-doc-reference-ingest
            JOB_FILE=k8s/safety-doc-reference-ingest-job.yaml
            kubectl delete job "${JOB_NAME}" --ignore-not-found=true
            kubectl apply -f "${JOB_FILE}"
            kubectl get job "${JOB_NAME}" -o wide
            kubectl get pods -l job-name="${JOB_NAME}" -o wide
            echo "Safety doc reference ingest job triggered. Follow logs with:"
            echo "kubectl logs -f job/${JOB_NAME} -n ${K8S_NAMESPACE}"
          else
            JOB_NAME=team5-qdrant-ingest
            JOB_FILE=k8s/qdrant-ingest-job.yaml
            kubectl delete job "${JOB_NAME}" --ignore-not-found=true
            kubectl apply -f "${JOB_FILE}"
            kubectl get job "${JOB_NAME}" -o wide
            kubectl get pods -l job-name="${JOB_NAME}" -o wide
            echo "Full ingest job triggered. Follow logs with:"
            echo "kubectl logs -f job/${JOB_NAME} -n ${K8S_NAMESPACE}"
          fi
