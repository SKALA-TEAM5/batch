name: Run Qdrant Batch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Batch mode
        required: true
        default: ingest-pdfs
        type: choice
        options:
          - ingest
          - ingest-pdfs
          - refresh
      pdf_objects:
        description: Comma-separated MinIO object names for ingest-pdfs mode
        required: false
        default: ""

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: skala-2025
  K8S_NAMESPACE: skala3-finalproj-class2-team5
  IMAGE_NAME: team5-batch
  IMAGE_TAG: latest

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/team5-batch:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Set namespace
        run: |
          kubectl config set-context --current --namespace="${K8S_NAMESPACE}"

      - name: Apply batch secrets
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
        run: |
          kubectl create secret generic team5-batch-secret \
            --namespace="${K8S_NAMESPACE}" \
            --from-literal=LAW_API_KEY="${LAW_API_KEY}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Run selected batch job
        run: |
          if [ "${{ inputs.mode }}" = "refresh" ]; then
            JOB_NAME=team5-qdrant-refresh
            JOB_FILE=k8s/qdrant-refresh-job.yaml
            kubectl delete job "${JOB_NAME}" --ignore-not-found=true
            kubectl apply -f "${JOB_FILE}"
            kubectl get job "${JOB_NAME}" -o wide
            kubectl get pods -l job-name="${JOB_NAME}" -o wide
            echo "Refresh job triggered. Follow logs with:"
            echo "kubectl logs -f job/${JOB_NAME} -n ${K8S_NAMESPACE}"
          elif [ "${{ inputs.mode }}" = "ingest-pdfs" ]; then
            if [ -z "${{ inputs.pdf_objects }}" ]; then
              echo "pdf_objects is required for ingest-pdfs mode."
              exit 1
            fi

            IFS=',' read -ra OBJECTS <<< "${{ inputs.pdf_objects }}"
            INDEX=0
            for OBJECT in "${OBJECTS[@]}"; do
              INDEX=$((INDEX + 1))
              OBJECT="$(echo "${OBJECT}" | sed 's/^ *//;s/ *$//')"
              if [ -z "${OBJECT}" ]; then
                continue
              fi
              JOB_NAME="team5-qdrant-ingest-pdf-${INDEX}"
              kubectl delete job "${JOB_NAME}" --ignore-not-found=true
              JOB_NAME="${JOB_NAME}" \
              IMAGE="${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/team5-batch:latest" \
              MINIO_OBJECT_NAME="${OBJECT}" \
              python -c 'import os, pathlib; text = pathlib.Path("k8s/qdrant-ingest-pdf-job.template.yaml").read_text(); text = text.replace("__JOB_NAME__", os.environ["JOB_NAME"]).replace("__IMAGE__", os.environ["IMAGE"]).replace("__MINIO_OBJECT_NAME__", os.environ["MINIO_OBJECT_NAME"]); pathlib.Path("/tmp/qdrant-ingest-pdf-job.yaml").write_text(text)'
              kubectl apply -f /tmp/qdrant-ingest-pdf-job.yaml
              kubectl get job "${JOB_NAME}" -o wide
            done
            kubectl get pods -l job=qdrant-ingest-pdf -o wide
            echo "PDF ingest jobs triggered. Follow logs with:"
            echo "kubectl logs -f job/team5-qdrant-ingest-pdf-1 -n ${K8S_NAMESPACE}"
          else
            JOB_NAME=team5-qdrant-ingest
            JOB_FILE=k8s/qdrant-ingest-job.yaml
            kubectl delete job "${JOB_NAME}" --ignore-not-found=true
            kubectl apply -f "${JOB_FILE}"
            kubectl get job "${JOB_NAME}" -o wide
            kubectl get pods -l job-name="${JOB_NAME}" -o wide
            echo "Full ingest job triggered. Follow logs with:"
            echo "kubectl logs -f job/${JOB_NAME} -n ${K8S_NAMESPACE}"
          fi
