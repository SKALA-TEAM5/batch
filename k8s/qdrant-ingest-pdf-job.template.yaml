apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-batch
    job: qdrant-ingest-pdf
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: team5-batch
        job: qdrant-ingest-pdf
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: team5-harbor-secret
      containers:
        - name: batch
          image: __IMAGE__
          imagePullPolicy: Always
          env:
            - name: QDRANT_URL
              value: http://team5-qdrant:6333
            - name: POSTGRES_HOST
              value: team5-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: safety
            - name: QDRANT_COLLECTION
              value: legal_documents
            - name: APP_MINIO_ENDPOINT
              value: http://team5-minio:9000
            - name: APP_MINIO_BUCKET
              value: safety-files
            - name: BATCH_MINIO_OBJECT_NAME
              value: "__MINIO_OBJECT_NAME__"
            - name: LAW_APP_USER
              valueFrom:
                secretKeyRef:
                  name: team5-postgres-secret
                  key: LAW_APP_USER
            - name: LAW_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team5-postgres-secret
                  key: LAW_APP_PASSWORD
            - name: LAW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: team5-batch-secret
                  key: LAW_API_KEY
            - name: APP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: team5-minio-secret
                  key: APP_MINIO_ACCESS_KEY
            - name: APP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: team5-minio-secret
                  key: APP_MINIO_SECRET_KEY
          command:
            - sh
            - -c
            - |
              export DATABASE_URL="postgresql://${LAW_APP_USER}:${LAW_APP_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
              python -m src.ingestion_service \
                --collection "${QDRANT_COLLECTION}" \
                --minio-object "${BATCH_MINIO_OBJECT_NAME}" \
                --ignore-state \
                --skip-law-api \
                --skip-usage-standard
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
