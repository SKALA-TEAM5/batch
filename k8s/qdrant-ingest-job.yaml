apiVersion: batch/v1
kind: Job
metadata:
  name: team5-qdrant-ingest
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-batch
    job: qdrant-ingest
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: team5-batch
        job: qdrant-ingest
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: team5-harbor-secret
      containers:
        - name: batch
          image: amdp-registry.skala-ai.com/skala26a-ai2/team5-batch:latest
          imagePullPolicy: Always
          env:
            - name: QDRANT_URL
              value: http://team5-qdrant:6333
            - name: POSTGRES_HOST
              value: team5-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: safety
            - name: QDRANT_COLLECTION
              value: legal_documents
            - name: LAW_APP_USER
              valueFrom:
                secretKeyRef:
                  name: team5-postgres-secret
                  key: LAW_APP_USER
            - name: LAW_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: team5-postgres-secret
                  key: LAW_APP_PASSWORD
          command:
            - sh
            - -c
            - |
              export DATABASE_URL="postgresql://${LAW_APP_USER}:${LAW_APP_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
              python -m src.ingestion_service --collection "${QDRANT_COLLECTION}" --force
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
